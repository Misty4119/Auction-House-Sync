name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - id: version
        name: Validate release tag
        shell: bash
        run: |
          version="$(./gradlew -q properties --console=plain | sed -n 's/^version: //p' | head -n 1)"
          expected_tag="v${version}"
          if [ -z "$version" ] || [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag must equal $expected_tag; received $GITHUB_REF_NAME." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        run: ./gradlew test shadowJar
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "AuctionHouse-${{ needs.validate-tag.outputs.version }}.jar"
          --generate-notes
